# The documentation nav — the only copy.
#
# `Site.Manual` (site/lib/site/manual.ex) parses this file when `mix
# site.build` renders the manual, published at managoat.com/docs. Adding,
# renaming or moving a page is a one-file change here; the files under docs/
# stay where they are, so a page's URL does not depend on where it sits in
# the sidebar.
#
# The sidebar is the four Diátaxis categories, after the home page:
# Tutorials (learn by doing), How-to guides (do one task), Explanation
# (understand why), Reference (look it up). A page goes where a reader in
# that mode would look for it, whatever its directory.
#
# **Three levels, at fixed indents.** A category at 2 spaces, a section or a
# page inside it at 6, and a section's pages at 10. Each line is one of two
# shapes, `- Title: file.md` for a page and `- Header:` for a category or a
# section. A section holds pages only. A line the parser cannot read RAISES
# rather than being skipped, and so does any other indent, a header at the
# third level, a line indented past the entry above it, and a header with
# nothing under it. A page silently missing from `/docs` is the failure being
# prevented.
#
# Guardrails in `site/test/manual_test.exs`: every page named here exists on
# disk, every page on disk is named here, and every internal `/docs` link and
# anchor resolves. `docs/cli.md` is diffed against the real CLI command tree
# by the Go suite.
#
# Paths are relative to `docs/`.
