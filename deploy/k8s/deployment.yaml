# The portable baseline. The probe layout, security posture and resource
# shape mirror what the hosted instance learned the hard way; the personal
# infrastructure — CNPG, Infisical, Traefik — lives in
# the maintainer's private overlay (decisions/0032) and does not follow it
# here.
#
# One replica, and only one. Managoat runs as a single node: its
# conversation and machine registries are local to the BEAM, so a second
# pod is a second, unconnected scheduler over the same sandboxes. More than
# one replica is unsupported (docs/architecture.md#one-node).
#
# Recreate, for the same reason. It stops the old pod before it starts the
# new one, so two BEAMs never overlap. A deploy therefore has an unavailable
# interval; its length depends on teardown and startup. Measure ingress with
# scripts/load-test/availability.py. Boot reports queued but unadmitted prompts
# as interrupted, and rehydrates fully provisioned conversations.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fountain
  labels:
    app: fountain
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fountain
  template:
    metadata:
      labels:
        app: fountain
    spec:
      # ConversationServers trap exits so terminate/2 can revoke each
      # sprite's callback key on the way down (#322); with many live
      # conversations that teardown can outrun the 30s default, after which
      # SIGKILL leaves un-revoked keys and orphaned sprites for the reaper.
      terminationGracePeriodSeconds: 120
      containers:
        - name: fountain
          # Retagged by kustomization.yaml's images: block — edit the pin
          # there, not here.
          image: ghcr.io/managoat/managoat:v0.39.1
          imagePullPolicy: IfNotPresent
          lifecycle:
            # Endpoints propagation is asynchronous: without this pause the
            # pod stops accepting while kube-proxy/ingress still route to
            # it, dropping SSE streams mid-conversation. Sleep long enough
            # for the Endpoints update to reach the dataplane, then let the
            # BEAM shut down.
            preStop:
              exec:
                command: ["sleep", "5"]
          ports:
            - name: http
              containerPort: 4000
            # Prometheus scrape endpoint, on its own listener so it never
            # rides the public Service. Scrape it in-cluster; do not expose
            # it — it enumerates routes, request rates and DB timings.
            - name: metrics
              containerPort: 9568
            # The egress broker's forward-proxy listener (ADR 0019). Reach it
            # from a sandbox through a TCP route, never the web Ingress.
            - name: broker
              containerPort: 14322
          env:
            - name: PHX_SERVER
              value: "true"
            - name: PORT
              value: "4000"
          envFrom:
            - configMapRef:
                name: fountain-config
            # SECRET_KEY_BASE, MASTER_SECRETS_KEY, DATABASE_URL,
            # SPRITES_TOKEN (+ mail/OAuth if used). See README.md.
            - secretRef:
                name: fountain-secrets
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          # Migrations run at boot, before the endpoint listens (unless
          # MIGRATE_ON_BOOT=false — see configmap.yaml). The startup probe
          # holds the other probes off for up to 150s so a slow migration is
          # not mistaken for a dead pod and restart-looped.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          # Readiness checks Postgres and the egress broker listener, then
          # gates traffic: a pod that cannot serve is
          # pulled from the Service without being killed, and recovery needs
          # no restart. Generous timeout because answering 503 with a dead
          # database takes ~3s, and a recorded 503 is more legible than a
          # probe timeout. The broker check adds nothing to that worst case;
          # it is a process lookup (#1726).
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 6
          # Liveness restarts the pod, so it checks nothing but the process:
          # pointing it at the database would restart every pod at once
          # during a Postgres blip, which does nothing to fix Postgres.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 3
