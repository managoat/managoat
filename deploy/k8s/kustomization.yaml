apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fountain

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  # Uncomment after editing the host in ingress.yaml. Left out of the base
  # because ingress controllers and TLS setups vary too much to guess at —
  # see README.md for the contract yours must satisfy.
  # - ingress.yaml
  # Nightly pg_dump to any S3-compatible bucket. Uncomment after creating the
  # fountain-backup-s3 Secret — setup is documented at the top of the file.
  # - backup-cronjob.yaml
  # Generic alerts. Needs the PrometheusRule CRD (prometheus-operator) and a
  # scrape of the metrics port — see the notes at the top of the file.
  # - prometheusrule.yaml

images:
  # Pin a release, not `latest` — `latest` moves on every merge to main.
  # Released tags: vX.Y.Z (immutable) and vX.Y (newest patch in the line).
  # https://managoat.com/docs/guides/operate/upgrade#how-versions-work
  - name: ghcr.io/managoat/managoat
    newTag: v0.39.2
