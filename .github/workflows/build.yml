# Builds the Managoat OCI image and pushes it to
# ghcr.io/managoat/managoat (and, for ADR 0082's deprecation window,
# ghcr.io/managoat/fountain) for every push to main whose CI
# workflow succeeded. Multi-arch
# (amd64 + arm64) — home-cloud k3s nodes are arm64 Apple Silicon Lima
# VMs, single-arch amd64 images fail at pull with
# "no match for platform"; amd64 stays for self-hosters.
#
# Each architecture builds NATIVELY (arm64 on the free ubuntu-24.04-arm
# runners) and pushes by digest; a merge job stitches the digests into one
# multi-arch manifest. The previous single-runner QEMU build spent ~22
# minutes emulating the arm64 Erlang compile; native + the registry-backed
# BuildKit cache below brings a warm code-change build to single-digit
# minutes. The `build` workflow name and its completion event are load-
# bearing: publish-manifests.yml listens for them.
name: build

on:
  workflow_dispatch:
  # Gated on CI instead of triggering directly on push: a commit whose CI
  # failed used to get built, published, and reconciled by Flux anyway.
  # Same idiom publish-manifests.yml uses to gate on this workflow. The
  # old push-trigger paths-ignore (paths that never affect the OCI image)
  # is re-implemented as the `changes` job below — workflow_run cannot
  # express path filters.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

env:
  # Hardcoded, not ${{ github.repository }}. The owner moved once already
  # (0048) and a literal is what made that move safe: a build under the new
  # owner cannot write the old owner's packages, so a stale literal fails
  # loudly here instead of publishing where Flux is not looking.
  IMAGE: ghcr.io/managoat/managoat
  # The image's name until ADR 0082. Every tag is also published here, so a
  # deployment that still pulls the old name keeps updating; a later release
  # stops (#2776).
  LEGACY_IMAGE: ghcr.io/managoat/fountain
  # The commit CI actually ran on — NOT github.sha, which for workflow_run
  # events is the default branch tip at trigger time and can race ahead if
  # another push lands while CI runs. Everything below (checkout, tags,
  # labels) uses this so the image is built from and tagged with the exact
  # commit that passed CI. Falls back to github.sha for workflow_dispatch.
  SRC_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

permissions:
  contents: read

jobs:
  changes:
    name: Decide whether the image needs a build
    # Only commits whose CI succeeded get built. workflow_dispatch stays an
    # ungated escape hatch, exactly as before.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ env.SRC_SHA }}
          # Full history: the diff below walks ancestry for the newest
          # commit whose image actually exists.
          fetch-depth: 0
          # Nothing after checkout needs the token: the filter step runs only
          # local git (rev-list, diff) and the registry probe carries its own
          # auth. Leaving it behind writes a push-capable credential into
          # .git/config that every later step inherits.
          persist-credentials: false

      - name: Skip paths that never affect the OCI image
        id: filter
        # The old push-trigger paths-ignore list (deploy/**,
        # decisions/**, root-level *.md — deploy/ is the portable self-hosting
        # manifests, never part of the image), plus site/** and docs/** (the
        # managoat.com pages and the manual, one static build with its own
        # image, built by site.yml), re-implemented as a diff from
        # the newest first-parent ancestor whose image EXISTS in the registry
        # (#414) — not HEAD^.
        #
        # docs/** and CHANGELOG.md were deliberately NOT on the list while
        # Fountain.Docs embedded both at compile time: with them ignored,
        # prod's /docs sat on the previous code commit's copy until the next
        # code change shipped (#770, found at v0.11.0). Since the manual
        # moved to site/ (decisions/0081) the image holds neither, so
        # ignoring them is safe again. Diffing one commit back assumed every ancestor
        # got built; a cancelled CI run plus a docs-only follow-up broke that
        # assumption, and the follow-up's one-commit diff reported "nothing
        # image-affecting" while the cancelled commit's code sat un-built.
        # Same ancestor walk publish-manifests.yml uses for its image pin.
        # Manifest-only changes still get a manifest artifact without a
        # build: publish-manifests.yml triggers directly on deploy/ pushes.
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "manual dispatch — building unconditionally"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base=""
          for candidate in $(git rev-list --first-parent -n 50 HEAD~1 2>/dev/null); do
            if docker manifest inspect \
                 "${IMAGE}:sha-${candidate}" > /dev/null 2>&1; then
              base="${candidate}"
              break
            fi
          done

          if [ -z "${base}" ]; then
            echo "no built ancestor image found — building unconditionally"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "diffing against newest built ancestor ${base:0:7}"
          changed="$(git diff --name-only "${base}" HEAD)"
          # Anything outside the ignore list means a build.
          if [ -n "${changed}" ] && printf '%s\n' "${changed}" \
               | grep -qvE '^(deploy|decisions|docs|site)/|^[^/]*\.md$'; then
            echo "image-affecting changes since ${base:0:7} — building"
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "only ignored paths changed since ${base:0:7} — skipping the build"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.arch }}
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            # Free for public repos; the cluster's own architecture, so the
            # image that matters most is the one built natively.
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ env.SRC_SHA }}
          # This job runs no authenticated git operation — GHCR gets an
          # explicit token below — so the image build and everything it
          # executes should not inherit one from .git/config.
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          # BUILD_SHA names the commit this image was built from, and that is
          # all it ever claims. An image built from tree T is reused for every
          # later commit with tree T (the `changes` job above skips the
          # build), and those pods report this commit — which is exactly what
          # the old manifest-side pin reported too: publish-manifests.yml
          # pinned FOUNTAIN_BUILD_SHA to the *image's* commit, never the
          # deployed one. Baking it here says the same thing with no patch
          # in the manifests (decisions/0032 addendum). It reaches the console
          # footer and the Sentry release.
          build-args: |
            BUILD_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SRC_SHA }}
          # Digest-only push; the merge job below owns the tags. Provenance
          # off so each push is exactly one image manifest — attestation
          # manifests would confuse the imagetools merge.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          # Layer cache in the registry, one ref per arch so the two builds
          # never thrash each other. mode=max also caches the build stage —
          # that's the deps.compile layer, which is the whole point.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }},mode=max

      - name: Export digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge the multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push the manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          SHA: ${{ env.SRC_SHA }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:sha-${SHA}" \
            --tag "${LEGACY_IMAGE}:latest" \
            --tag "${LEGACY_IMAGE}:sha-${SHA}" \
            $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${IMAGE}:sha-${SHA}"
