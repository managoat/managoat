name: Release

# Builds the Go CLI under cli/, publishes the version-tagged server
# image, and attaches binaries to a GitHub Release. Triggered by
# pushing a v*.*.* tag, or manually via workflow_dispatch with an
# existing tag.
#
# A successful tag-pushed run is also prod's deploy: publish-manifests.yml
# listens for this workflow's completion (by its name, `Release`, which is
# load-bearing) and moves the manifest artifact's `latest` to the tag
# (decisions/0080). A run dispatched by hand does not deploy; dispatch
# publish-manifests with ref=<tag> and promote for that.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release as (must already exist on a commit)."
        required: true

env:
  GO_VERSION: "1.26.0"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact: managoat-linux-amd64
          - goos: linux
            goarch: arm64
            artifact: managoat-linux-arm64
          - goos: darwin
            goarch: amd64
            artifact: managoat-darwin-amd64
          - goos: darwin
            goarch: arm64
            artifact: managoat-darwin-arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: cli/go.sum

      # A release used to cross-compile without ever running the suite, so a
      # binary could ship with failing tests. Run once on the host platform —
      # cross-compiled test binaries cannot be executed here anyway.
      # `-count=1` for the same reason as ci.yml: a cached pass can outlive the
      # tree that earned it (#1542), and a release must not ship on one.
      - name: Test
        working-directory: cli
        run: go test -count=1 ./...

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # Stamped into the binary so `managoat --version` and the ACP
          # handshake's `agentInfo` report what someone actually installed.
          # A tag push gives GITHUB_REF_NAME; a manual dispatch names the tag.
          VERSION: ${{ inputs.tag || github.ref_name }}
        working-directory: cli
        run: |
          set -euxo pipefail
          mkdir -p ../dist
          go build -trimpath \
            -ldflags "-s -w -X github.com/managoat/managoat/cli/internal/cmd.Version=${VERSION}" \
            -o "../dist/${{ matrix.artifact }}" ./cmd/managoat
          file "../dist/${{ matrix.artifact }}"
          du -h "../dist/${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  openapi:
    name: Export OpenAPI spec
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    # Same service + env shape as ci.yml's test job: the spec renders from
    # the compiled app, and app start is verified against this exact setup.
    services:
      postgres:
        image: postgres:16@sha256:287eced1f33b59ed265ed13a60d3680dd7646d70c4dc0e785f59a470ebc03eeb
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fountain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.19.2"
          otp-version: "28.3"

      - name: Restore deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Restore build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: _build
          key: ${{ runner.os }}-build-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-
            ${{ runner.os }}-build-

      - name: Install dependencies
        run: mix deps.get

      # openapi.export boots the app, and since Oban arrived (#217) boot
      # requires the oban_jobs table — an unmigrated database aborts startup.
      - name: Set up database
        run: mix ecto.create --quiet && mix ecto.migrate --quiet

      # The same export CI runs, so the document attached to a tag is byte for
      # byte the one the SDK's types were generated from — keys sorted,
      # ordering independent of the encoder (#1411).
      - name: Export spec
        run: python3 scripts/sdk-contract/generate.py --export-only

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openapi.json
          path: dist/openapi.json

  image:
    # The server image is built fresh from the tag's tree rather than
    # re-tagging the sha- image build.yml pushes for the same commit. The
    # bump commit is pushed to main with the tag, so build.yml does build it,
    # but that build runs concurrently with this one and this workflow must
    # not wait on it or race it: the tag's tree, built here, is the release.
    #
    # Each architecture builds NATIVELY and pushes by digest; image-manifest
    # below stitches the digests into one multi-arch manifest and owns the
    # tags. This is build.yml's shape, and it is here for the same reason: a
    # single runner with QEMU spent 22.5 of a release's 23.1 minutes emulating
    # the arm64 Erlang compile. build.yml migrated off it and this job was
    # left behind, so the only slow build left in the repo was the one that
    # runs least often and blocks the release.
    name: Build versioned server image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        # Built natively on both arches, so the release's wall clock is one
        # native build, not the sum.
        arch: [amd64, arm64]
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            # Free for public repos; the cluster's own architecture.
            runner: ubuntu-24.04-arm

    steps:
      - name: Resolve tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          if ! echo "${tag}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "'${tag}' is not a vX.Y.Z tag" >&2
            exit 1
          fi
          {
            echo "tag=${tag}"
            echo "minor=${tag%.*}"
            echo "version=${tag#v}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          # The tag's commit, explicitly — a workflow_dispatch runs on the
          # ref it was dispatched from, which need not be the tag.
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          persist-credentials: false

      - name: Resolve build sha
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # v6 uploads a .dockerbuild build-record artifact by default. Nothing
          # consumes it, and its presence broke the release job, whose
          # download-all step failed on it after 5 retries — twice.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_SHA=${{ steps.sha.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.sha.outputs.sha }}
            org.opencontainers.image.version=${{ steps.tag.outputs.version }}
          # Digest-only push; image-manifest owns the tags. Provenance off so
          # each push is exactly one image manifest — attestation manifests
          # would confuse the imagetools merge.
          outputs: type=image,name=ghcr.io/managoat/managoat,push-by-digest=true,name-canonical=true,push=true
          provenance: false
          # Read build.yml's cache, write nothing back. The layers above
          # `COPY mix.exs` hit; the deps.compile layer below it may not,
          # because the bump commit exists precisely to change the version
          # in mix.exs. build.yml owns that cache and is building the same
          # commit beside this run; a release must not overwrite the cache
          # every subsequent main build depends on.
          cache-from: type=registry,ref=ghcr.io/managoat/managoat:buildcache-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  image-manifest:
    # Tags: vX.Y.Z is immutable; vX.Y moves to the newest patch in its line.
    # :latest continues to track main via build.yml and is not touched here.
    name: Publish versioned server image
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Resolve tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          if ! echo "${tag}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "'${tag}' is not a vX.Y.Z tag" >&2
            exit 1
          fi
          {
            echo "tag=${tag}"
            echo "minor=${tag%.*}"
          } >> "$GITHUB_OUTPUT"

      # Deliberately NOT merge-multiple: each artifact lands in its own
      # directory named for the artifact, so the per-arch digest count below
      # can see a build job that pushed something unexpected.
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: image-digest-*

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push the manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/managoat/managoat
          # The image's name until ADR 0082; each release is tagged there too
          # for the deprecation window (#2776).
          LEGACY_IMAGE: ghcr.io/managoat/fountain
          TAG: ${{ steps.tag.outputs.tag }}
          MINOR: ${{ steps.tag.outputs.minor }}
        run: |
          set -euo pipefail

          # One digest per arch, in per-arch directories. Anything else means
          # a build job pushed something unexpected, and a manifest built from
          # it would publish a release image nobody checked.
          refs=()
          for arch in amd64 arm64; do
            dir="image-digest-${arch}"
            if [ ! -d "$dir" ]; then
              echo "no digest artifact for ${arch}" >&2
              exit 1
            fi
            digests=("$dir"/*)
            if [ "${#digests[@]}" -ne 1 ]; then
              echo "expected 1 digest in ${dir}, found ${#digests[@]}" >&2
              exit 1
            fi
            refs+=("${IMAGE}@sha256:$(basename "${digests[0]}")")
          done

          docker buildx imagetools create \
            --tag "${IMAGE}:${TAG}" \
            --tag "${IMAGE}:${MINOR}" \
            --tag "${LEGACY_IMAGE}:${TAG}" \
            --tag "${LEGACY_IMAGE}:${MINOR}" \
            "${refs[@]}"
          docker buildx imagetools inspect "${IMAGE}:${TAG}"

  compose-boot:
    # ci.yml's "Compose boots the pinned image" skips on the bump commit,
    # because the pin names this image before it exists (#1329). This is where that check runs instead: the tag's tree
    # pins the tag, the manifest job just published it, and the release
    # below waits for the answer. A tag whose image will not boot through
    # the documented quick start gets no release page telling self-hosters
    # to pin it.
    name: Compose boots the released image
    needs: image-manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          persist-credentials: false

      - name: The tree pins the tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          pin="$(sed -nE 's/^MANAGOAT_IMAGE_TAG=(v[0-9]+\.[0-9]+\.[0-9]+)$/\1/p' .env.compose.example)"
          if [ "${pin}" != "${TAG}" ]; then
            echo ".env.compose.example pins ${pin}, but this is ${TAG}; the bump did not reach this tree" >&2
            exit 1
          fi

      - name: Run the documented quick start and probe the app
        run: scripts/compose-boot-check.sh

      - name: Dump container logs
        if: failure()
        run: docker compose logs --timestamps

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # image-manifest is a needs so a release is never published without its
    # image — the release page is what tells a self-hoster the tag exists to
    # pin. Depending on the manifest job rather than the per-arch builds: two
    # pushed digests with no manifest list on the tag is not a published image.
    # compose-boot goes one further: the image also has to boot through the
    # quick start the release page points at.
    needs: [build, openapi, image-manifest, compose-boot]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      # Only the artifacts the release ships, by name — never download-all.
      # Jobs in this run upload artifacts we do not attach (the image job's
      # docker build record, for one), and an undownloadable stray must not
      # block the release.
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: "{managoat-*,openapi.json}"

      # The binary was `fountain` until ADR 0082. The same four binaries are
      # attached under their old names too, so a script or a README that
      # downloads releases/latest/download/fountain-<os>-<arch> keeps working
      # through the deprecation window (#2776).
      - name: Copy the binaries under their old names
        run: |
          set -euo pipefail
          for a in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            mkdir -p "artifacts/fountain-${a}"
            cp "artifacts/managoat-${a}/managoat-${a}" "artifacts/fountain-${a}/fountain-${a}"
          done

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/managoat-linux-amd64/managoat-linux-amd64
            artifacts/managoat-linux-arm64/managoat-linux-arm64
            artifacts/managoat-darwin-amd64/managoat-darwin-amd64
            artifacts/managoat-darwin-arm64/managoat-darwin-arm64
            artifacts/fountain-linux-amd64/fountain-linux-amd64
            artifacts/fountain-linux-arm64/fountain-linux-arm64
            artifacts/fountain-darwin-amd64/fountain-darwin-amd64
            artifacts/fountain-darwin-arm64/fountain-darwin-arm64
            artifacts/openapi.json/openapi.json
          fail_on_unmatched_files: true

  bump-tap:
    name: Bump Homebrew tap
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: release

    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # By name, for the reason the release job above states: this run also
      # uploads artifacts the tap does not want (the per-arch image digests),
      # and a download-all is one stray artifact away from failing a step
      # that only ever needed the four binaries.
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: managoat-*

      - name: Compute SHA256s
        id: sha
        run: |
          set -euo pipefail
          for a in darwin-amd64 darwin-arm64 linux-amd64 linux-arm64; do
            sum=$(sha256sum "artifacts/managoat-${a}/managoat-${a}" | awk '{print $1}')
            key=$(echo "${a}" | tr - _)
            echo "${key}=${sum}" >> "$GITHUB_OUTPUT"
          done

      - name: Checkout tap repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: managoat/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      # The formula was `fountain` until ADR 0082. formula_renames.json is
      # Homebrew's own mechanism for a renamed formula in a tap: `brew upgrade`
      # moves a `fountain` install to `managoat`, and `brew install
      # managoat/tap/fountain` installs `managoat`. The formula also links the
      # binary as `fountain`, so scripts that call the old name keep working
      # through the deprecation window (#2776).
      - name: Write formula
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
          SHA_DARWIN_ARM64: ${{ steps.sha.outputs.darwin_arm64 }}
          SHA_DARWIN_AMD64: ${{ steps.sha.outputs.darwin_amd64 }}
          SHA_LINUX_ARM64: ${{ steps.sha.outputs.linux_arm64 }}
          SHA_LINUX_AMD64: ${{ steps.sha.outputs.linux_amd64 }}
        run: |
          set -euo pipefail
          cat > tap/Formula/managoat.rb <<EOF
          class Managoat < Formula
            desc "CLI for Managoat — HTTP/JSON client, SSE consumer, and secret-store helper"
            homepage "https://github.com/managoat/managoat"
            version "${VERSION}"
            license "Apache-2.0"

            on_macos do
              on_arm do
                url "https://github.com/managoat/managoat/releases/download/${TAG}/managoat-darwin-arm64"
                sha256 "${SHA_DARWIN_ARM64}"
              end
              on_intel do
                url "https://github.com/managoat/managoat/releases/download/${TAG}/managoat-darwin-amd64"
                sha256 "${SHA_DARWIN_AMD64}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/managoat/managoat/releases/download/${TAG}/managoat-linux-arm64"
                sha256 "${SHA_LINUX_ARM64}"
              end
              on_intel do
                url "https://github.com/managoat/managoat/releases/download/${TAG}/managoat-linux-amd64"
                sha256 "${SHA_LINUX_AMD64}"
              end
            end

            def install
              arch = Hardware::CPU.arm? ? "arm64" : "amd64"
              os = OS.mac? ? "darwin" : "linux"
              bin.install "managoat-#{os}-#{arch}" => "managoat"
              bin.install_symlink bin/"managoat" => "fountain"
            end

            test do
              assert_match "managoat", shell_output("#{bin}/managoat --help")
            end
          end
          EOF
          rm -f tap/Formula/fountain.rb
          echo '{"fountain": "managoat"}' > tap/formula_renames.json

      - name: Commit and push
        working-directory: tap
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "managoat-release-bot"
          git config user.email "noreply@github.com"
          git add -A Formula formula_renames.json
          if git diff --cached --quiet; then
            echo "Formula already up to date for ${TAG}; nothing to commit."
            exit 0
          fi
          git commit -m "managoat ${TAG}"
          git push
