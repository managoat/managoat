name: publish-manifests

# Publishes what Flux deploys: an OCI artifact at
# ghcr.io/managoat/managoat-manifests holding deploy/ from one commit's tree,
# with deploy/k8s's `images:` pinned to an image built from that tree.
# That pairing is the point. Flux once tracked `main`, where the two arrive
# in separate commits minutes apart — the PR changes a manifest, the image
# finishes building later, and the pin lands after that. Flux polls every
# 5 minutes, so it routinely applied a manifest against the previous image.
#
# The artifact is the product's deployable and nothing more: deploy/ as
# committed, with deploy/k8s/kustomization.yaml's `newTag` naming the image.
# Nothing in it is specific to any one cluster; the maintainer's own instance
# applies its private overlay on top with Flux `patches` from the home-cloud
# repo (decisions/0032), and anyone else's Flux could consume the same
# artifact the same way.
#
# That is not theoretical: #241 moved the readiness probe to a new path, Flux
# applied it against an image with no such route, and every pod 404'd its
# probe and never became ready. A derived, force-pushed `deploy` branch fixed
# that (#250); the artifact replaces the branch with the same guarantee and
# less git machinery (#304). This workflow pushes no git refs at all.
#
# Prod deploys releases, not merges (decisions/0080). The cluster's
# OCIRepository reconciles the `latest` tag, and only a release moves it:
#
#   push to main → CI → build.yml builds ghcr.io/managoat/managoat:sha-<sha>
#       → this workflow publishes `sha-<short>`: that sha's tree with that
#         image pinned. It does NOT move `latest`. It exists for hotfixes and
#         rollbacks, and it runs the validation below on every merge.
#
#   vX.Y.Z tag → release.yml builds ghcr.io/managoat/managoat:vX.Y.Z, boots
#         it through the quick start, and creates the GitHub Release
#       → when that run succeeds, this workflow publishes `vX.Y.Z`: deploy/
#         exactly as committed at the tag, whose pin release-bump.yml already
#         set to vX.Y.Z — the image self-hosters run — and moves `latest`
#         to it. Waiting for release.yml to finish is what keeps the
#         manifest from racing its image: the pinned tag exists, and booted,
#         before the artifact names it.
#
#   deploy/** push → `sha-<short>` pinning the newest ancestor image, the
#         manifest fast path. It does NOT move `latest` either: a
#         manifest-only change ships with the next release, or now through
#         the dispatch below.
#
# Manual escape hatch (hotfix, or a release whose run failed after its image
# was published): Actions → publish-manifests → Run workflow with `ref` set to
# a commit or a vX.Y.Z tag, and `promote` checked to move `latest` to it.
#   gh workflow run publish-manifests.yml -f ref=<sha|vX.Y.Z> -f promote=true
#
# Rollback is one command, no git and no workflow involved:
#   flux tag artifact oci://ghcr.io/managoat/managoat-manifests:v<previous> --tag latest
# (or :sha-<short> for a per-merge artifact).
#
# `main` is never deployed directly. The committed `newTag` in deploy/k8s is
# the release pin self-hosters use; a `sha-` artifact replaces it, a release
# artifact carries it unchanged.

on:
  # Per-merge artifacts, after the image for that sha exists.
  # Release artifacts, after release.yml published and booted the image.
  # No `branches:` filter: a tag-triggered Release run's head_branch is the
  # tag, which a `[main]` filter would drop. The plan job sorts them out.
  workflow_run:
    workflows: [build, Release]
    types: [completed]
  # The manifest fast path: a push touching only the deployed manifests
  # publishes a `sha-` artifact directly — no image build to wait for. The
  # image pin resolves to the newest *ancestor* commit whose image exists
  # (see below). Without this trigger a deploy-only commit would have no
  # artifact to promote: build.yml skips deploy/**.
  push:
    branches: [main]
    paths:
      - "deploy/**"
  workflow_dispatch:
    inputs:
      ref:
        description: "A commit sha, or a vX.Y.Z tag (defaults to the branch tip)"
        required: false
        default: ""
      promote:
        description: "Move `latest` to this artifact, which deploys it to prod"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    name: Decide what to publish
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      # sha: a `sha-<short>` artifact pinning a sha- image.
      # release: a `vX.Y.Z` artifact, the tag's tree as committed.
      # skip: nothing to publish.
      mode: ${{ steps.plan.outputs.mode }}
      sha: ${{ steps.plan.outputs.sha }}
      tag: ${{ steps.plan.outputs.tag }}
      # Whether `latest` moves.
      promote: ${{ steps.plan.outputs.promote }}
      # Whether to refuse moving `latest` backwards. On for the automatic
      # release path, off for a dispatch, where moving it back is the point.
      guard: ${{ steps.plan.outputs.guard }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          # Full history and tags, to resolve a dispatched ref or a tag.
          fetch-depth: 0
          persist-credentials: false

      - name: Plan
        id: plan
        # Every event-supplied string arrives through env, never interpolated
        # into the script: head_branch and the dispatch ref are free text.
        env:
          EVENT: ${{ github.event_name }}
          WR_NAME: ${{ github.event.workflow_run.name }}
          WR_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          IN_REF: ${{ inputs.ref }}
          IN_PROMOTE: ${{ inputs.promote }}
        run: |
          set -euo pipefail
          release_re='^v[0-9]+\.[0-9]+\.[0-9]+$'
          mode=skip sha="" tag="" promote=false guard=false

          tag_commit() { git rev-parse --verify --quiet "refs/tags/$1^{commit}"; }

          case "${EVENT}" in
            workflow_run)
              case "${WR_NAME}" in
                build)
                  if [ "${WR_HEAD_BRANCH}" = "main" ]; then
                    mode=sha sha="${WR_HEAD_SHA}"
                  else
                    echo "build ran on ${WR_HEAD_BRANCH}, not main; nothing to publish."
                  fi
                  ;;
                Release)
                  # A tag push's head_branch is the tag. A Release run
                  # dispatched by hand reports the branch it ran from; that
                  # one deploys through this workflow's own dispatch instead.
                  if [[ "${WR_HEAD_BRANCH}" =~ ${release_re} ]]; then
                    tag="${WR_HEAD_BRANCH}"
                    commit="$(tag_commit "${tag}" || true)"
                    if [ "${commit}" != "${WR_HEAD_SHA}" ]; then
                      echo "tag ${tag} names ${commit:-nothing}, but the release ran on ${WR_HEAD_SHA}; refusing." >&2
                      exit 1
                    fi
                    mode=release sha="${commit}" promote=true guard=true
                  else
                    echo "Release ran on ${WR_HEAD_BRANCH}, not a vX.Y.Z tag; dispatch this workflow with ref=<tag> to deploy it."
                  fi
                  ;;
                *)
                  echo "unexpected workflow ${WR_NAME}" >&2
                  exit 1
                  ;;
              esac
              ;;
            push)
              mode=sha sha="${GITHUB_SHA}"
              ;;
            workflow_dispatch)
              ref="${IN_REF:-${GITHUB_SHA}}"
              if [[ "${ref}" =~ ${release_re} ]]; then
                sha="$(tag_commit "${ref}")" || { echo "no tag ${ref}" >&2; exit 1; }
                mode=release tag="${ref}"
              else
                sha="$(git rev-parse --verify --quiet "${ref}^{commit}")" \
                  || { echo "${ref} is not a commit in this repository" >&2; exit 1; }
                mode=sha
              fi
              promote="${IN_PROMOTE:-false}"
              ;;
          esac

          echo "mode=${mode} sha=${sha} tag=${tag} promote=${promote} guard=${guard}"
          {
            echo "mode=${mode}"
            echo "sha=${sha}"
            echo "tag=${tag}"
            echo "promote=${promote}"
            echo "guard=${guard}"
          } >> "$GITHUB_OUTPUT"

  # Nothing deployed unvalidated (#414): before this job existed, the
  # manifest fast path pushed the live Deployment (and, back then, the CNPG
  # cluster and the PrometheusRule) straight to the artifact Flux reconciles,
  # with no check of any kind — a typo'd manifest was applied to prod by the
  # reconciler. It runs for every artifact, so a bad manifest fails at the
  # merge that introduced it, not at the release that would deploy it.
  validate:
    name: Validate the manifests
    needs: plan
    if: ${{ needs.plan.outputs.mode != 'skip' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SRC_SHA: ${{ needs.plan.outputs.sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ env.SRC_SHA }}
          persist-credentials: false

      - name: kustomize build + kubeconform (deploy/k8s/)
        run: |
          set -euo pipefail
          KUBECONFORM_VERSION=v0.7.0
          curl -sSfL \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz kubeconform

          for dir in deploy/k8s; do
            echo "── ${dir}"
            kubectl kustomize "${dir}" > "/tmp/${dir//\//-}.yaml"
            # The CRDs catalog covers PrometheusRule (the one CRD the
            # baseline ships, commented out of its kustomization); -strict
            # rejects unknown fields, which is the class of typo that
            # survives YAML parsing.
            ./kubeconform -strict -summary \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              "/tmp/${dir//\//-}.yaml"
          done

      - name: promtool check rules (PrometheusRule alert expressions)
        run: |
          set -euo pipefail
          PROM_VERSION=3.5.0
          curl -sSfL \
            "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz" \
            | tar xz --strip-components=1 "prometheus-${PROM_VERSION}.linux-amd64/promtool"

          # promtool reads a bare rules file; the PrometheusRule wraps the
          # groups under spec.groups.
          for f in deploy/k8s/prometheusrule.yaml; do
            echo "── ${f}"
            python3 -c "import yaml; yaml.safe_dump(yaml.safe_load(open('${f}'))['spec'], open('/tmp/rules.yaml', 'w'))"
            ./promtool check rules /tmp/rules.yaml
          done

  publish:
    name: Publish the manifest artifact
    needs: [plan, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      # The commit whose tree is published — NOT main's tip. Pinning onto
      # the tip is what let a newer manifest ride out with an older image.
      SRC_SHA: ${{ needs.plan.outputs.sha }}
      MODE: ${{ needs.plan.outputs.mode }}
      TAG: ${{ needs.plan.outputs.tag }}
      PROMOTE: ${{ needs.plan.outputs.promote }}
      GUARD: ${{ needs.plan.outputs.guard }}
      MANIFESTS: ghcr.io/managoat/managoat-manifests
      # The artifact's name until ADR 0082. Each artifact, and each move of
      # `latest`, is mirrored here so a Flux source that still reads the old
      # name keeps deploying; a later release stops (#2776).
      LEGACY_MANIFESTS: ghcr.io/managoat/fountain-manifests
      IMAGE: ghcr.io/managoat/managoat

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ env.SRC_SHA }}
          # Full history: the image walk and the backwards-move guard below
          # walk ancestry.
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve image tag
        id: tag
        # Release: the vX.Y.Z image release.yml built from the tag's tree. It
        # must already exist; this workflow runs after release.yml succeeded,
        # so it does, and a dispatch that names a tag whose release has not
        # published its image is refused here.
        #
        # sha: the newest first-parent ancestor (SRC_SHA included) whose
        # image actually exists in the registry. After a build workflow_run
        # that is SRC_SHA itself. After a manifest-only push it is the image
        # already built, which is the point: the pushed tree changed nothing
        # the image is built from. The walk doubles as the existence guard —
        # no image in the last 50 commits aborts.
        run: |
          set -euo pipefail
          if [ "${MODE}" = "release" ]; then
            image="${IMAGE}:${TAG}"
            if ! docker manifest inspect "${image}" > /dev/null 2>&1; then
              echo "${image} is not published; release.yml must finish before ${TAG} deploys." >&2
              exit 1
            fi
            {
              echo "image=${image}"
              echo "artifact=${TAG}"
            } >> "$GITHUB_OUTPUT"
            echo "manifest tree ${TAG} (${SRC_SHA:0:7}) pins image ${image}"
            exit 0
          fi

          image=""
          image_sha=""
          for candidate in $(git rev-list --first-parent -n 50 "${SRC_SHA}"); do
            if docker manifest inspect \
                 "${IMAGE}:sha-${candidate}" > /dev/null 2>&1; then
              image="${IMAGE}:sha-${candidate}"
              # The commit the IMAGE was built from, which is not always
              # SRC_SHA: on a manifest-only push this walk lands on an
              # ancestor. The pin must name what runs, not the tree that
              # triggered the publish.
              image_sha="${candidate}"
              break
            fi
          done

          if [ -z "${image}" ]; then
            echo "no built image found in the 50 commits behind ${SRC_SHA:0:7}; refusing to publish." >&2
            exit 1
          fi

          echo "manifest tree ${SRC_SHA:0:7} pins image ${image}"
          {
            echo "image=${image}"
            echo "image_sha=${image_sha}"
            echo "artifact=sha-${SRC_SHA:0:7}"
          } >> "$GITHUB_OUTPUT"

      - name: Pin the image tag in the working tree
        env:
          IMAGE_SHA: ${{ steps.tag.outputs.image_sha }}
        run: |
          set -euo pipefail
          # The baseline's `images:` block pins a release for self-hosters.
          # A release artifact ships it as committed, and it must name this
          # release: release-bump.yml rewrote it in the tagged commit. A sha
          # artifact pins the sha image built from this tree instead. Only
          # the checkout is edited — nothing is committed — and the publish
          # fails unless exactly one newTag line names the image, so a stale
          # pin can never ship silently.
          f=deploy/k8s/kustomization.yaml
          n=$(grep -cE '^\s*newTag:' "$f")
          [ "$n" = 1 ] || { echo "expected exactly one newTag in $f, found $n" >&2; exit 1; }

          if [ "${MODE}" = "release" ]; then
            grep -qE "^\s*newTag: ${TAG}$" "$f" || {
              echo "$f at ${TAG} pins $(grep -E '^\s*newTag:' "$f"), not ${TAG}" >&2
              exit 1
            }
            echo "release tree pins ${TAG}"
            exit 0
          fi

          sed -i -E "s|^(\s*newTag:).*|\1 sha-${IMAGE_SHA}|" "$f"
          grep -qE "^\s*newTag: sha-${IMAGE_SHA}$" "$f" || {
            echo "image pin substitution failed in $f" >&2
            exit 1
          }
          git diff --stat "$f"

      - name: Setup flux CLI
        uses: fluxcd/flux2/action@3fa784edd773d56630bb9f62645e08f70c2cff0a # v2.10.0
        with:
          # Matches the cluster's source-controller. Nothing here is
          # version-sensitive, but drift is one more thing to reason about
          # during an incident.
          version: 2.8.7

      - name: Publish the manifest artifact
        id: publish
        env:
          ARTIFACT: ${{ steps.tag.outputs.artifact }}
          PINNED: ${{ steps.tag.outputs.image }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "$GITHUB_TOKEN" \
            | docker login ghcr.io -u "${ACTOR}" --password-stdin

          # Stage what the cluster Kustomizations consume: all of deploy/,
          # relative layout intact (./deploy/k8s for the app, ./deploy/grafana
          # for the dashboards). All of deploy/ rather than a named list: the
          # named list once omitted deploy/grafana (#1001) and Flux sat at
          # BuildFailed, wedging every later deploy while the running
          # workload stayed healthy — the quiet kind of broken.
          staging=$(mktemp -d)
          cp -R deploy "${staging}/deploy"

          # Build what is about to be published, with the pin in it.
          echo "── verifying the staged tree builds"
          kubectl kustomize "${staging}/deploy/k8s" \
            | grep -qF "image: ${PINNED}" \
            || { echo "staged tree does not pin ${PINNED}" >&2; exit 1; }

          flux push artifact "oci://${MANIFESTS}:${ARTIFACT}" \
            --path="${staging}" \
            --source="https://github.com/${REPOSITORY}" \
            --revision="${SRC_SHA}"
          flux push artifact "oci://${LEGACY_MANIFESTS}:${ARTIFACT}" \
            --path="${staging}" \
            --source="https://github.com/${REPOSITORY}" \
            --revision="${SRC_SHA}"
          echo "manifest artifact published: ${MANIFESTS}:${ARTIFACT} (revision ${SRC_SHA})"

          if [ "${PROMOTE}" != "true" ]; then
            echo "latest not moved; prod deploys releases (decisions/0080)."
            echo "promoted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Refuse to move `latest` backwards on the automatic path: a
          # re-run of an older release's workflow must not roll prod back.
          # The artifact's source sha lives in the standard OCI revision
          # annotation (set by --revision above), so this needs no extra
          # state. Absent annotation (first run) or an unknown sha both fall
          # through to publishing. A dispatch skips the guard: a person who
          # names an older ref and asks to promote it means a rollback.
          if [ "${GUARD}" = "true" ]; then
            previous=$(docker buildx imagetools inspect --raw "${MANIFESTS}:latest" 2>/dev/null \
              | jq -r '.annotations["org.opencontainers.image.revision"] // empty' || true)
            if [ -n "${previous}" ] && [ "${previous}" != "${SRC_SHA}" ] \
               && git merge-base --is-ancestor "${SRC_SHA}" "${previous}" 2>/dev/null; then
              echo "${ARTIFACT} is an ancestor of the published ${previous:0:7}; refusing to move latest backwards."
              echo "promoted=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          flux tag artifact "oci://${MANIFESTS}:${ARTIFACT}" --tag latest
          flux tag artifact "oci://${LEGACY_MANIFESTS}:${ARTIFACT}" --tag latest
          echo "latest now ${MANIFESTS}:${ARTIFACT}"
          echo "promoted=true" >> "$GITHUB_OUTPUT"

      - name: Nudge Flux
        # Tells the cluster's notification-controller the artifact moved, so
        # the OCIRepository reconciles now instead of on its next 5m poll
        # (the fountain-artifact-receiver in home-cloud platform/flux-webhooks/).
        # Only when `latest` moved; nothing else is deployed. Strictly
        # best-effort: a deploy must never fail because a webhook did — the
        # poll interval remains the fallback. The URL embeds the receiver's
        # token-derived path; it rotates with github-webhook-token, so update
        # this secret when that rotates.
        if: ${{ steps.publish.outputs.promoted == 'true' }}
        env:
          FLUX_WEBHOOK_URL: ${{ secrets.FLUX_WEBHOOK_URL }}
        run: |
          if [ -z "${FLUX_WEBHOOK_URL}" ]; then
            echo "FLUX_WEBHOOK_URL not set; relying on the poll interval."
            exit 0
          fi

          if curl -fsS -m 10 -X POST "${FLUX_WEBHOOK_URL}" > /dev/null; then
            echo "flux nudged — reconcile requested"
          else
            echo "webhook ping failed; the 5m poll will pick it up"
          fi
