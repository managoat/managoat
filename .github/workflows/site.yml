name: site

# Builds and publishes the managoat.com pages and the manual in site/: a Mix
# project of its own that renders static HTML, served by nginx from
# ghcr.io/managoat/site (ADR 0034, amended 2026-10-15 when the pages came back
# from managoat/site; ADR 0081 for the manual).
#
# Nothing triggers this workflow on its own. ci.yml's `site` job tests and
# renders the site on every pull request that touches it (a required part of
# CI required) and on every push to main; when a push to main moved site/,
# docs/, a file the manual includes, the toolchain pin or this file, ci.yml's
# `site-publish` job calls this with
# the render that passed those tests, uploaded as the `site-dist` artifact of
# the same run. So nothing is published that the tests did not pass.
#
# What it publishes is what Flux deploys: an OCI artifact,
# ghcr.io/managoat/site-manifests, holding site/k8s (at k8s/ in the artifact)
# with kustomization.yaml's `newTag` rewritten from its placeholder to the
# image built from this commit: the same shape publish-manifests.yml uses for
# the app. The site repo committed the pin back to its own main instead; this
# repository's ruleset refuses a GITHUB_TOKEN push to main, and an artifact
# needs no commit at all.
on:
  workflow_call:
    secrets:
      FLUX_WEBHOOK_URL:
        required: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/managoat/site
  MANIFESTS: ghcr.io/managoat/site-manifests

jobs:
  image:
    name: Build the site image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false

      - name: Fetch the render
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: site/dist

      # The Dockerfile only copies files into nginx:alpine, so both
      # architectures build on one runner with no emulation.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The `site` package was created by managoat/site, so this repository
      # needs Write under the package's "Manage Actions access" to push here.
      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: site
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  publish:
    name: Publish the site manifests
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # One publish at a time, never cancelled: the guard below decides order.
    concurrency:
      group: site-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          # Full history: the backwards-move guard walks ancestry.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup flux CLI
        uses: fluxcd/flux2/action@b9c17924adb533d3617ec7de97a7b0f4acc07b39 # v2.9.6
        with:
          # Matches the cluster's source-controller, as publish-manifests.yml.
          version: 2.8.7

      - name: Stage site/k8s with the image pinned
        id: stage
        run: |
          set -euo pipefail
          staging="$(mktemp -d)"
          cp -R site/k8s "${staging}/k8s"
          # The committed newTag is a placeholder; the artifact carries this
          # commit's image. Exactly one newTag line, or the publish stops.
          f="${staging}/k8s/kustomization.yaml"
          n=$(grep -cE '^\s*newTag:' "$f")
          [ "$n" = 1 ] || { echo "expected exactly one newTag in $f, found $n" >&2; exit 1; }
          sed -i -E "s|^(\s*newTag:).*|\1 sha-${GITHUB_SHA}|" "$f"
          kubectl kustomize "${staging}/k8s" | grep -q "image: ${IMAGE}:sha-${GITHUB_SHA}" \
            || { echo "staged tree does not carry the sha pin" >&2; exit 1; }
          echo "dir=${staging}" >> "$GITHUB_OUTPUT"

      - name: Publish the artifact
        env:
          STAGING: ${{ steps.stage.outputs.dir }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          # Refuse to move `latest` backwards: an older commit's run that
          # finishes late must not replace a newer deploy.
          previous=$(docker buildx imagetools inspect --raw "${MANIFESTS}:latest" 2>/dev/null \
            | jq -r '.annotations["org.opencontainers.image.revision"] // empty' || true)
          if [ -n "${previous}" ] && [ "${previous}" != "${GITHUB_SHA}" ] \
             && git merge-base --is-ancestor "${GITHUB_SHA}" "${previous}" 2>/dev/null; then
            echo "${GITHUB_SHA::7} is an ancestor of the published ${previous::7}; not moving latest."
            exit 0
          fi

          flux push artifact "oci://${MANIFESTS}:sha-${GITHUB_SHA::7}" \
            --path="${STAGING}" \
            --source="https://github.com/${{ github.repository }}" \
            --revision="${GITHUB_SHA}"
          flux tag artifact "oci://${MANIFESTS}:sha-${GITHUB_SHA::7}" --tag latest
          echo "published ${MANIFESTS}:sha-${GITHUB_SHA::7}, latest re-tagged"

      - name: Nudge Flux
        # Best-effort, as in publish-manifests.yml: the 5-minute poll is the
        # fallback. The receiver behind this URL reconciles the site only once
        # home-cloud lists the managoat-site OCIRepository among its resources.
        env:
          FLUX_WEBHOOK_URL: ${{ secrets.FLUX_WEBHOOK_URL }}
        run: |
          if [ -z "${FLUX_WEBHOOK_URL}" ]; then
            echo "FLUX_WEBHOOK_URL not set; relying on the poll interval."
            exit 0
          fi
          curl -fsS -m 10 -X POST "${FLUX_WEBHOOK_URL}" > /dev/null \
            && echo "flux nudged" || echo "webhook ping failed; the poll will pick it up"
